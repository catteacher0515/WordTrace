<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordTrace</title>
  <meta http-equiv="refresh" content="0; url=output/四级备考重点词书-2021到2025-top300.html" />
  <style>
    :root {
      --paper: #f4efe4;
      --ink: #222018;
      --muted: #6a6253;
      --accent: #8e4b2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.65), transparent 28%),
        linear-gradient(180deg, #f8f3e8 0%, #f1e7d2 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(720px, 100%);
      padding: 32px 28px;
      border-radius: 28px;
      background: rgba(255,255,255,0.54);
      border: 1px solid rgba(34, 32, 24, 0.12);
      box-shadow: 0 20px 60px rgba(73, 55, 24, 0.10);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 6vw, 64px);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      line-height: 1.8;
      color: var(--muted);
      font-size: 18px;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>WordTrace</h1>
    <p>正在进入四级备考重点词书。如果没有自动跳转，请点击
      <a href="output/四级备考重点词书-2021到2025-top300.html">这里</a>。
    </p>
  </main>
  <script>
    window.location.replace("output/四级备考重点词书-2021到2025-top300.html");
  </script>
</body>
</html>
